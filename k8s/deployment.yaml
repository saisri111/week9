
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedemoapp
  template:
    metadata:
      labels:
        app: kubedemoapp
    spec:
      containers:
        - name: registration-app
          image: saisri12/registration-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
